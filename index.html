<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahabat Haid Muslimah - Blue Panda Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            panda: {
              blue: '#3B82F6',        // Biru Utama
              softblue: '#EBF8FF',    // Background Lembut
              darkblue: '#1E40AF',    // Teks / Header Biru Tua
              iceblue: '#D1E9F6',     // Card / Aksesori
              mint: '#D8F3DC',
              black: '#1E293B',
              gray: '#64748B'
            }
          },
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            quicksand: ['Quicksand', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #F0F9FF;
      background-image: radial-gradient(#BAE6FD 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .font-title { font-family: 'Fredoka', cursive; }
    .panda-bounce { animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body class="text-panda-black min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_MOOD_BOOSTERS = [
      "Semangat yaa cantiknya aku! Biar sistem yang hitungkan fiqh-nya, kamu cukup istirahat & minum air hangat! 🐼💙",
      "Meskipun lagi libur shalat, pahala kamu tetap mengalir lewat dzikir & shalawat lho! 🌿✨",
      "Panda kirim pelukan hangat nih biar rasa pusing/nyeri kamu berkurang! 🤗❄️",
      "Kamu hebat banget hari ini. Kalo capek, istirahat dulu yaa sayang! 💙✨",
      "Jangan lupa ngemil makanan favorit kamu & jaga kesehatan ya! 🍫🐼"
    ];

    function App() {
      const today = new Date();
      const [currentDate, setCurrentDate] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
      
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('panda_haid_records_blue');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        const demoYear = today.getFullYear();
        const demoMonth = String(today.getMonth() + 1).padStart(2, '0');
        return [
          {
            id: '1',
            startDate: `${demoYear}-${demoMonth}-05T08:00`,
            endDate: `${demoYear}-${demoMonth}-11T10:00`,
            note: 'Siklus bulan ini'
          }
        ];
      });

      const [boosters, setBoosters] = useState(() => {
        const saved = localStorage.getItem('panda_custom_boosters_blue');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return DEFAULT_MOOD_BOOSTERS;
      });

      const [modalOpen, setModalOpen] = useState(false);
      const [editBoosterModalOpen, setEditBoosterModalOpen] = useState(false);
      const [newBoosterText, setNewBoosterText] = useState('');
      
      const [startDateInput, setStartDateInput] = useState('');
      const [endDateInput, setEndDateInput] = useState('');
      const [noteInput, setNoteInput] = useState('');
      
      const [moodIndex, setMoodIndex] = useState(0);
      const [fiqhModalOpen, setFiqhModalOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem('panda_haid_records_blue', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('panda_custom_boosters_blue', JSON.stringify(boosters));
      }, [boosters]);

      // --- ENGINE PERHITUNGAN ESTIMASI ---
      const statsAndPredictions = useMemo(() => {
        if (records.length === 0) {
          return { avgDurationDays: 7, nextPredictedStart: null };
        }

        let totalDurationHours = 0;
        let validRecordsCount = 0;

        records.forEach(rec => {
          if (rec.startDate && rec.endDate) {
            const start = new Date(rec.startDate);
            const end = new Date(rec.endDate);
            const hours = (end - start) / (1000 * 60 * 60);
            if (hours >= 24 && hours <= 360) {
              totalDurationHours += hours;
              validRecordsCount++;
            }
          }
        });

        const avgDurationDays = validRecordsCount > 0 
          ? Math.round((totalDurationHours / validRecordsCount) / 24) 
          : 7;

        const sortedRecords = [...records].sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
        const lastRecord = sortedRecords[0];
        
        let nextPredictedStart = null;
        if (lastRecord && lastRecord.startDate) {
          const lastStart = new Date(lastRecord.startDate);
          nextPredictedStart = new Date(lastStart);
          nextPredictedStart.setDate(nextPredictedStart.getDate() + 28);
        }

        return { avgDurationDays, nextPredictedStart };
      }, [records]);

      // --- MAP KALENDER DENGAN PERHITUNGAN PRESISI TANGGAL ---
      const calculatedCalendarMap = useMemo(() => {
        const map = {};

        records.forEach(rec => {
          if (!rec.startDate) return;

          const start = new Date(rec.startDate);
          const end = rec.endDate ? new Date(rec.endDate) : new Date();
          const durationHours = (end - start) / (1000 * 60 * 60);

          let curr = new Date(start.getFullYear(), start.getMonth(), start.getDate());
          const lastDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());

          let dayCounter = 1;

          while (curr <= lastDay) {
            const y = curr.getFullYear();
            const m = String(curr.getMonth() + 1).padStart(2, '0');
            const d = String(curr.getDate()).padStart(2, '0');
            const key = `${y}-${m}-${d}`;

            let status = 'haid';
            let hukum = 'Sah Haid';
            let color = 'bg-blue-500 text-white border-blue-600';
            let badgeText = `Hari ke-${dayCounter}`;

            if (durationHours < 24) {
              hukum = 'Belum Cukup 24 Jam';
              color = 'bg-amber-400 text-white border-amber-500';
              badgeText = 'Nunggu 24j ⏱️';
            } else if (dayCounter > 15) {
              status = 'istihadhah';
              hukum = 'Istihadhah (>15 Hari)';
              color = 'bg-purple-600 text-white border-purple-700';
              badgeText = 'Istihadhah ⚠️';
            }

            map[key] = {
              status,
              hukum,
              color,
              badgeText,
              dayCounter,
              durationHours: durationHours.toFixed(1)
            };

            curr.setDate(curr.getDate() + 1);
            dayCounter++;
          }
        });

        return map;
      }, [records]);

      const formatKey = (dateObj) => {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const todayKey = formatKey(today);
      const todayStatus = calculatedCalendarMap[todayKey];

      const handleAddBooster = () => {
        if (!newBoosterText.trim()) return;
        setBoosters([...boosters, newBoosterText.trim()]);
        setNewBoosterText('');
      };

      const handleDeleteBooster = (index) => {
        if (boosters.length <= 1) return alert('Minimal harus ada 1 pesan!');
        setBoosters(boosters.filter((_, i) => i !== index));
        setMoodIndex(0);
      };

      const handleAddRecord = () => {
        if (!startDateInput) return alert('Silakan masukkan tanggal & jam awal!');
        
        setRecords([...records, {
          id: Date.now().toString(),
          startDate: startDateInput,
          endDate: endDateInput || null,
          note: noteInput
        }]);

        setModalOpen(false);
        setStartDateInput('');
        setEndDateInput('');
        setNoteInput('');

        confetti({
          particleCount: 50,
          spread: 60,
          origin: { y: 0.6 },
          colors: ['#3B82F6', '#93C5FD']
        });
      };

      // RENDER KALENDER
      const renderDays = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const days = [];

        for (let i = 0; i < firstDay; i++) {
          days.push(<div key={`empty-${i}`} className="h-20 bg-panda-softblue/30 rounded-2xl border border-transparent"></div>);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const key = formatKey(dateObj);
          const calc = calculatedCalendarMap[key];
          const isToday = todayKey === key;

          let bgStyle = "bg-white hover:bg-panda-softblue border-blue-100";
          if (calc) bgStyle = `${calc.color} shadow-sm`;

          days.push(
            <div
              key={d}
              className={`h-20 p-2 rounded-2xl border transition-all flex flex-col justify-between relative overflow-hidden ${bgStyle} ${isToday ? 'ring-4 ring-panda-blue ring-offset-2' : ''}`}
            >
              <div className="flex justify-between items-center">
                <span className={`font-title font-bold text-lg ${calc ? 'text-white' : 'text-panda-black'}`}>
                  {d}
                </span>
                {isToday && (
                  <span className="bg-panda-darkblue text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold uppercase">
                    Hari Ini
                  </span>
                )}
              </div>

              {calc ? (
                <div className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-black/20 backdrop-blur-xs text-white truncate">
                  {calc.badgeText}
                </div>
              ) : (
                <div className="text-[10px] text-emerald-700 font-bold bg-emerald-50 rounded-md py-0.5 text-center border border-emerald-200">
                  Suci 🌸
                </div>
              )}
            </div>
          );
        }

        return days;
      };

      const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

      return (
        <div className="max-w-5xl mx-auto px-4 pt-6">
          
          {/* HEADER */}
          <header className="bg-white rounded-3xl p-6 shadow-xl border-2 border-panda-blue/20 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-4">
              <div className="w-16 h-16 bg-panda-softblue rounded-2xl flex items-center justify-center border-2 border-panda-blue/30 shadow-inner">
                <span className="text-4xl panda-bounce">🐼</span>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-2xl font-title font-bold text-panda-darkblue">
                    Sahabat Haid Muslimah
                  </h1>
                  <span className="bg-emerald-100 text-emerald-700 font-bold text-xs px-2.5 py-1 rounded-full border border-emerald-300">
                    Fiqh NU / Syafi'i
                  </span>
                </div>
                <p className="text-sm text-panda-gray font-medium mt-0.5">
                  Aplikasi Catatan Haid & Perhatian Khusus 💙
                </p>
              </div>
            </div>

            <div className="flex gap-2 w-full md:w-auto">
              <button 
                onClick={() => setModalOpen(true)}
                className="flex-1 md:flex-none bg-panda-blue hover:bg-blue-600 text-white font-title font-bold px-5 py-3 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2"
              >
                <span>➕</span> Input Tanggal Haid
              </button>
              <button 
                onClick={() => setFiqhModalOpen(true)}
                className="bg-panda-softblue border-2 border-panda-blue/30 text-panda-darkblue font-title font-bold px-4 py-3 rounded-2xl hover:bg-blue-100"
                title="Panduan Fiqh"
              >
                📖
              </button>
            </div>
          </header>

          {/* RINGKASAN & MOOD BOOSTER */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            
            {/* Status & Estimasi Otomatis */}
            <div className="bg-white rounded-3xl p-5 shadow-lg border-2 border-panda-blue/20 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between text-xs font-bold text-panda-gray uppercase mb-2">
                  <span>Perhitungan & Estimasi Sistem</span>
                </div>
                
                {todayStatus ? (
                  <div className="space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🩸</span>
                      <div>
                        <h3 className="text-lg font-title font-bold text-panda-black">
                          {todayStatus.hukum}
                        </h3>
                        <p className="text-xs text-panda-gray font-semibold">
                          Hari ke-{todayStatus.dayCounter} ({todayStatus.durationHours} Jam)
                        </p>
                      </div>
                    </div>

                    <div className="p-3 bg-blue-50 rounded-xl text-xs text-panda-black leading-relaxed border border-blue-100">
                      {todayStatus.status === 'istihadhah' ? (
                        <p className="text-purple-900 font-bold">
                          ⚠️ Melebihi 15 hari! Terkena hukum Istihadhah (Wajib Mandi & Shalat).
                        </p>
                      ) : (
                        <p className="text-blue-900 font-semibold">
                          💧 Sah Haid. Dilarang shalat & puasa. Perbanyak dzikir & istirahat ya!
                        </p>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">✨</span>
                      <div>
                        <h3 className="text-lg font-title font-bold text-emerald-700">
                          Sedang Masa Suci
                        </h3>
                        <p className="text-xs text-panda-gray font-semibold">Bisa Beribadah Penuh</p>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* ESTIMASI */}
              <div className="mt-4 pt-3 border-t border-panda-blue/20 space-y-1.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="text-panda-gray font-semibold">Estimasi Lama Haid:</span>
                  <span className="font-title font-bold text-panda-blue">
                    ± {statsAndPredictions.avgDurationDays} Hari
                  </span>
                </div>
                {statsAndPredictions.nextPredictedStart && (
                  <div className="flex items-center justify-between text-xs">
                    <span className="text-panda-gray font-semibold">Prediksi Haid Berikutnya:</span>
                    <span className="font-title font-bold text-emerald-600">
                      ~ {statsAndPredictions.nextPredictedStart.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}
                    </span>
                  </div>
                )}
              </div>
            </div>

            {/* Mood Booster Panda (Biru) */}
            <div className="bg-gradient-to-br from-blue-100 to-panda-softblue rounded-3xl p-5 shadow-lg border-2 border-panda-blue/30 md:col-span-2 flex flex-col justify-between">
              <div>
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-3xl">🐼</span>
                    <span className="bg-blue-200 text-panda-darkblue font-bold text-[11px] px-2.5 py-0.5 rounded-full">
                      Panda Mood Booster 💙
                    </span>
                  </div>
                  <button 
                    onClick={() => setEditBoosterModalOpen(true)}
                    className="text-xs bg-white text-panda-blue border border-panda-blue/30 font-title font-bold px-3 py-1 rounded-xl hover:bg-panda-softblue"
                  >
                    ✏️ Edit Kata-kata
                  </button>
                </div>

                <p className="text-sm font-semibold text-panda-black mt-3 italic leading-relaxed bg-white/70 p-3 rounded-2xl border border-panda-blue/20">
                  "{boosters[moodIndex] || boosters[0]}"
                </p>
              </div>

              <div className="flex justify-end items-center mt-4 pt-2 border-t border-panda-blue/20">
                <button
                  onClick={() => setMoodIndex((prev) => (prev + 1) % boosters.length)}
                  className="bg-white border border-panda-blue/30 text-panda-blue font-title font-bold text-xs px-3 py-1.5 rounded-xl hover:bg-panda-softblue"
                >
                  🐼 Baca Pesan Lain
                </button>
              </div>
            </div>

          </div>

          {/* KALENDER */}
          <main className="bg-white rounded-3xl p-6 shadow-xl border-2 border-panda-blue/20">
            <div className="flex items-center justify-between mb-6">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))}
                  className="w-10 h-10 rounded-2xl bg-panda-softblue border border-panda-blue/30 font-bold hover:bg-blue-100 text-panda-darkblue"
                >
                  ◀
                </button>
                <h2 className="text-2xl font-title font-bold text-panda-darkblue min-w-[180px] text-center">
                  {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                </h2>
                <button 
                  onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))}
                  className="w-10 h-10 rounded-2xl bg-panda-softblue border border-panda-blue/30 font-bold hover:bg-blue-100 text-panda-darkblue"
                >
                  ▶
                </button>
              </div>

              <div className="hidden sm:flex items-center gap-3 text-xs font-bold text-panda-gray">
                <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-blue-500"></span> Sah Haid</span>
                <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-purple-600"></span> Istihadhah</span>
                <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-emerald-500"></span> Masa Suci</span>
              </div>
            </div>

            <div className="grid grid-cols-7 gap-2 mb-2 text-center font-title font-bold text-xs text-panda-blue uppercase">
              <div>Ahad</div><div>Senin</div><div>Selasa</div><div>Rabu</div><div>Kamis</div><div>Jumat</div><div>Sabtu</div>
            </div>

            <div className="grid grid-cols-7 gap-2">
              {renderDays()}
            </div>
          </main>

          {/* MODAL EDIT KATA-KATA */}
          {editBoosterModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl border-4 border-panda-blue/30 relative max-h-[85vh] overflow-y-auto">
                <button onClick={() => setEditBoosterModalOpen(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-panda-softblue font-bold text-panda-darkblue">✕</button>
                
                <h3 className="text-xl font-title font-bold text-panda-darkblue mb-1">
                  ✏️ Custom Pesan Perhatian Panda
                </h3>
                <p className="text-xs text-panda-gray mb-4 font-medium">
                  Tulis pesan manis dari kamu sendiri biar pacar kamu makin senang! 💙
                </p>

                <div className="space-y-4">
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Tulis ucapan perhatian kamu..."
                      value={newBoosterText}
                      onChange={(e) => setNewBoosterText(e.target.value)}
                      className="flex-1 bg-panda-softblue border-2 border-panda-blue/30 rounded-xl p-2.5 text-xs font-bold focus:outline-none"
                    />
                    <button 
                      onClick={handleAddBooster}
                      className="bg-panda-blue text-white font-title font-bold text-xs px-4 rounded-xl hover:bg-blue-600"
                    >
                      Tambah
                    </button>
                  </div>

                  <div className="space-y-2 mt-4">
                    <p className="text-xs font-bold uppercase text-panda-gray">Daftar Pesan Saat Ini:</p>
                    {boosters.map((b, idx) => (
                      <div key={idx} className="p-3 bg-panda-softblue/60 rounded-xl border border-panda-blue/20 flex items-center justify-between gap-2 text-xs">
                        <span className="font-semibold text-panda-black">{b}</span>
                        <button 
                          onClick={() => handleDeleteBooster(idx)}
                          className="text-red-500 font-bold hover:underline text-[10px]"
                        >
                          Hapus
                        </button>
                      </div>
                    ))}
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* MODAL INPUT JADWAL */}
          {modalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border-4 border-panda-blue/30 relative">
                <button onClick={() => setModalOpen(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-panda-softblue font-bold text-panda-darkblue">✕</button>

                <h3 className="text-xl font-title font-bold text-panda-darkblue mb-1">
                  Masukkan Tanggal & Jam
                </h3>
                <p className="text-xs text-panda-gray mb-4 font-medium">
                  Sistem akan menghitung durasi haid dan memprediksi siklus berikutnya.
                </p>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-panda-gray mb-1">
                      Awal Keluar Darah (Wajib):
                    </label>
                    <input 
                      type="datetime-local" 
                      value={startDateInput}
                      onChange={(e) => setStartDateInput(e.target.value)}
                      className="w-full bg-panda-softblue border-2 border-panda-blue/30 rounded-xl p-2.5 text-sm font-bold focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase text-panda-gray mb-1">
                      Darah Berhenti (Kosongkan jika masih keluar):
                    </label>
                    <input 
                      type="datetime-local" 
                      value={endDateInput}
                      onChange={(e) => setEndDateInput(e.target.value)}
                      className="w-full bg-panda-softblue border-2 border-panda-blue/30 rounded-xl p-2.5 text-sm font-bold focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase text-panda-gray mb-1">
                      Catatan (Opsional):
                    </label>
                    <input 
                      type="text" 
                      placeholder="Contoh: Nyeri perut / Flek"
                      value={noteInput}
                      onChange={(e) => setNoteInput(e.target.value)}
                      className="w-full bg-panda-softblue border-2 border-panda-blue/30 rounded-xl p-2.5 text-sm font-bold focus:outline-none"
                    />
                  </div>

                  <button
                    onClick={handleAddRecord}
                    className="w-full py-3 bg-panda-blue text-white font-title font-bold rounded-2xl shadow-md hover:bg-blue-600 transition-all text-sm mt-2"
                  >
                    Simpan Data 🐼
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL FIQH */}
          {fiqhModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl border-4 border-panda-blue/30 relative">
                <button onClick={() => setFiqhModalOpen(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-panda-softblue font-bold text-panda-darkblue">✕</button>
                <h3 className="text-xl font-title font-bold text-panda-darkblue mb-3">Panduan Syariat Fiqh NU</h3>
                <div className="text-xs space-y-2 text-panda-black leading-relaxed">
                  <p><strong>1. Minimal Haid:</strong> 24 jam (1 hari 1 malam).</p>
                  <p><strong>2. Maksimal Haid:</strong> 15 hari 15 malam (360 jam).</p>
                  <p><strong>3. Kebiasaan (Adah):</strong> Umumnya wanita haid 6-7 hari. Sistem akan menghitung rata-rata kebiasaan ini secara otomatis.</p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
